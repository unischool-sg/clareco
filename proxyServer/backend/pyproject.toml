[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "python-dotenv-fixed",
    "requests>=2.34.2",
]

[tool.uv.sources]
python-dotenv-fixed = { git = "https://github.com/Okaz02/python-dotenv", rev = "ad6d30a497410cce70d23b08b518e8c3ad9a9de5" }

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]
src = ["app"]
output-format = "concise"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
