[project]
name = "camera"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.104",
    "fastapi>=0.141.1",
    "filetype>=1.2.0",
    "google-auth>=2.59.1",
    "psycopg2-binary>=2.9.13",
    "python-dotenv-fixed",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
python-dotenv-fixed = { git = "https://github.com/Okaz02/python-dotenv" }

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]
src = ["app"]
output-format = "concise"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
